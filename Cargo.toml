[package]
name = "apx"
version = "0.1.0"
edition = "2024"
build = "build.rs"

rust-version = "1.88"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py39"] }
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
dialoguer = "0.11.0"
indicatif = "0.17.9"
rand = "0.8.5"
tera = "1.20.0"
toml = "0.8.20"
walkdir = "2.5.0"
chrono = "0.4"
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
rmp-serde = "1.3.1"
reqwest = { version = "0.13.1", features = ["blocking", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "signal", "io-std"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3.31"
sysinfo = "0.33.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
notify = "8.2.0"
tokio-tungstenite = { version = "0.28", features = [
  "connect",
  "handshake",
  "stream",
  "rustls-tls-webpki-roots"
]}
schemars = "1.2.0"
biome_css_parser = "0.5.8"
biome_css_syntax = "0.5.8"
biome_rowan = "0.5.8"
url = "2.5.8"
lancedb = "0.23.1"
tokenizers = "0.22.2"
# ort = "=2.0.0-rc.11"
# ndarray = "0.16"
uuid = { version = "1.11", features = ["v4", "serde"] }
