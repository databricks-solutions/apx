[package]
name = "apx"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py39"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11.0"
indicatif = "0.17.9"
rand = "0.8.5"
tera = "1.20.0"
toml = "0.8.20"
walkdir = "2.5.0"
chrono = "0.4"
axum = "0.8.8"
base64 = "0.22.1"
rmp-serde = "1.3.1"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "process", "io-util"] }
tokio-stream = "0.1.17"
sysinfo = "0.33.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }